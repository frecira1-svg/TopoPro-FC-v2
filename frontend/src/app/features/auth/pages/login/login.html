<div class="login-container">
  <div class="login-card">
    <h1>TopoPro</h1>
    <p class="subtitle">Inicia sesión en tu cuenta</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="campo">
        <label for="correo">Correo</label>
        <input id="correo" type="email" formControlName="correo" placeholder="tucorreo@ejemplo.com" />
        <p class="error" *ngIf="form.get('correo')?.touched && form.get('correo')?.hasError('required')">El correo es obligatorio.</p>
        <p class="error" *ngIf="form.get('correo')?.touched && form.get('correo')?.hasError('email')">Ingresa un correo válido.</p>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" />
        <p class="error" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('required')">La contraseña es obligatoria.</p>
        <p class="error" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('minlength')">La contraseña debe tener al menos 6 caracteres.</p>
      </div>

      <p class="error" *ngIf="error()">{{ error() }}</p>

      <button type="submit" [disabled]="cargando() || form.invalid">
        {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="registro-link">
      ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
    </p>
  </div>
</div>
